# ODLET gateway (inside the stack). Published on 127.0.0.1:GATEWAY_PORT and fronted by the host
# nginx (TLS, Cloudflare-only) as https://odlet.xyz. One origin for everything:
#   /auth/v1/*       -> GoTrue          /rest/v1/*  -> PostgREST
#   /functions/v1/*  -> wallet-link     /*          -> Next.js (site + Unity WebGL files)
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  include /etc/nginx/mime.types;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  # Public traffic carries CF-Connecting-IP; internal calls (web -> gateway) are unlimited.
  map $http_cf_connecting_ip $limit_key { "" ""; default $binary_remote_addr; }
  limit_req_zone $limit_key zone=gw_auth:10m rate=5r/s;
  limit_req_zone $limit_key zone=gw_api:10m rate=20r/s;
  limit_req_zone $limit_key zone=gw_web:10m rate=30r/s;
  limit_req_status 429;
  limit_conn_zone $limit_key zone=gw_conn:10m;
  # Default is 503, which the Unity loader and Cloudflare report as an outage; 429 says what it is.
  limit_conn_status 429;

  upstream gotrue    { server auth:9999; keepalive 16; }
  upstream postgrest { server rest:3000; keepalive 16; }
  upstream fn        { server functions:8000; keepalive 8; }
  upstream site      { server web:3000; keepalive 16; }

  server {
    listen 8000;
    server_name _;
    client_max_body_size 2m;
    # A cold /play load is ~50 parallel requests (Next chunks, fonts, 4 Unity files, API).
    limit_conn gw_conn 120;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    location /auth/v1/ {
      limit_req zone=gw_auth burst=20 nodelay;
      proxy_pass http://gotrue/;
    }
    location /rest/v1/ {
      limit_req zone=gw_api burst=40 nodelay;
      proxy_pass http://postgrest/;
    }
    location /functions/v1/wallet-link {
      limit_req zone=gw_auth burst=10 nodelay;
      proxy_pass http://fn/;
    }
    location /functions/v1/ { return 404; }
    # Unity WebGL files straight from disk: exact Content-Length (Unity's progress bar and cache
    # need it) and no Node in the path. .unityweb files are pre-gzipped with a JS fallback.
    # Static and read-only: no request-rate limit (the site links them with ?v=<build hash>).
    location /unity/ {
      alias /srv/unity/;
      types { application/javascript js; application/wasm wasm; }
      default_type application/octet-stream;
      # Versioned URLs (?v=) are immutable; bare URLs revalidate (ETag) so a redeploy is seen at once.
      set $unity_cache "no-cache";
      if ($arg_v) { set $unity_cache "public, max-age=31536000, immutable"; }
      add_header Cache-Control $unity_cache always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    location /_next/static/ {
      proxy_pass http://site;
    }
    location / {
      limit_req zone=gw_web burst=60 nodelay;
      proxy_pass http://site;
    }
  }
}
