# Host nginx site for https://odlet.xyz (Cloudflare proxied, SSL mode Full).
# Install: sudo cp deploy/prod/nginx-host/odlet.xyz.conf /etc/nginx/sites-available/odlet.xyz
#          sudo ln -s /etc/nginx/sites-available/odlet.xyz /etc/nginx/sites-enabled/odlet.xyz
#          sudo nginx -t && sudo systemctl reload nginx
# TLS: a self-signed origin cert (/etc/nginx/ssl/odlet.xyz.*) is enough for Cloudflare "Full". For "Full (strict)" swap in a
# Cloudflare Origin Certificate or a Let's Encrypt cert.

server {
    listen 80;
    listen [::]:80;
    server_name odlet.xyz www.odlet.xyz odlet.fun www.odlet.fun;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://odlet.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.odlet.xyz odlet.fun www.odlet.fun;
    ssl_certificate     /etc/nginx/ssl/odlet.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/odlet.xyz.key;
    return 301 https://odlet.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odlet.xyz;

    ssl_certificate     /etc/nginx/ssl/odlet.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/odlet.xyz.key;

    # Only Cloudflare may connect directly ($is_cloudflare from /etc/nginx/cloudflare-geo.conf).
    if ($is_cloudflare = 0) { return 403; }

    access_log /var/log/nginx/odlet.access.log;
    error_log  /var/log/nginx/odlet.error.log warn;

    client_max_body_size 5m;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
