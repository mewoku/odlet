# Archives the Unity-exported Xcode project and uploads it to TestFlight.
#
# Unity exports the project on Windows (RONRIKU > Export iOS (Store, no crypto) -> Builds/iOS/ODLET);
# store/ios-release.ps1 zips it and attaches it to a *draft* GitHub release (not public), then starts
# this workflow with that release's tag. Signing is automatic with an App Store Connect API key
# (Admin or App Manager role; Xcode creates/downloads the distribution certificate and profile).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_ISSUER_ID    Issuer ID (Users and Access > Integrations)
#   ASC_KEY_P8       Contents of AuthKey_<id>.p8
#   APPLE_TEAM_ID    10-character Team ID
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag holding ODLET-ios-xcode.zip
        required: true

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Download the Xcode project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --pattern 'ODLET-ios-xcode.zip'
          unzip -q ODLET-ios-xcode.zip -d xcode
          ls xcode

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd xcode
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ODLET.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            | tail -n 60
          test -d "$RUNNER_TEMP/ODLET.xcarchive"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ODLET.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
